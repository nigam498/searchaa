<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Burp Request Converter</title>
<style>
body { font-family: Arial; background:#0f172a; color:#e2e8f0; padding:20px; }
.container { max-width:1000px; margin:auto; }
textarea { width:100%; height:200px; margin-top:10px; padding:10px; border-radius:10px; border:none; background:#1e293b; color:#fff; }
button { margin-top:10px; padding:10px 20px; border:none; border-radius:10px; background:#38bdf8; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<div class="container">
<h2>🔥 Advanced Chrome → Burp Converter</h2>

<textarea id="input" placeholder=":method GET\n:authority example.com\n:path /test\naccept: */*"></textarea>
<button onclick="convert()">Convert</button>

<textarea id="output" placeholder="Burp request will appear here..."></textarea>
</div>

<script>
function convert(){
  const raw = document.getElementById('input').value;
  const lines = raw.split('\n');

  let method = '';
  let path = '';
  let host = '';
  let headers = {};

  lines.forEach(l => {
    let line = l.trim();
    if(!line) return;

    // normalize tab or space split
    let parts = line.split(/\s+/);

    if(line.startsWith(':method')) method = parts.pop();
    else if(line.startsWith(':path')) path = parts.pop();
    else if(line.startsWith(':authority')) host = parts.pop();
    else if(line.startsWith(':scheme')) return;
    else {
      let idx = line.indexOf(':');
      if(idx !== -1){
        let key = line.substring(0, idx).trim();
        let val = line.substring(idx+1).trim();

        // merge cookies properly
        if(key.toLowerCase() === 'cookie'){
          headers['Cookie'] = (headers['Cookie'] ? headers['Cookie'] + '; ' : '') + val;
        } else {
          headers[key.replace(/(^.|-.)/g, s => s.toUpperCase())] = val;
        }
      }
    }
  });

  // build request
  let result = `${method} ${path} HTTP/2\n`;
  result += `Host: ${host}\n`;

  for(let key in headers){
    result += `${key}: ${headers[key]}\n`;
  }

  document.getElementById('output').value = result;
}
</script>
</body>
</html>
