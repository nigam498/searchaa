<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header → Burp Request Converter</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: auto;
}
textarea {
  width: 100%;
  height: 180px;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #38bdf8;
  color: black;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  background: #0ea5e9;
}
</style>
</head>
<body>
<div class="container">
<h2>Chrome Headers → Burp Request</h2>
<p>Paste raw headers (from DevTools) below:</p>

<textarea id="input"></textarea>
<button onclick="convert()">Convert</button>

<p>Burp Request Output:</p>
<textarea id="output"></textarea>
</div>

<script>
function convert() {
  const input = document.getElementById("input").value;
  const lines = input.split("\n");

  let method = "GET";
  let path = "/";
  let host = "";
  let headers = [];

  lines.forEach(line => {
    line = line.trim();

    if (line.startsWith(":method")) {
      method = line.split("\t").pop().trim();
    } else if (line.startsWith(":path")) {
      path = line.split("\t").pop().trim();
    } else if (line.startsWith(":authority")) {
      host = line.split("\t").pop().trim();
    } else if (!line.startsWith(":")) {
      headers.push(line);
    }
  });

  let result = `${method} ${path} HTTP/2\nHost: ${host}\n`;

  headers.forEach(h => {
    if (h) result += h + "\n";
  });

  document.getElementById("output").value = result;
}
</script>
</body>
</html>
